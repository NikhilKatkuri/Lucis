services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - lucis-mongo:/data/db
  api:
    build: .
    depends_on:
      - mongo
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/lucis
      SIMULATION_ENABLED: "true"
    ports:
      - "4000:4000"
volumes:
  lucis-mongo:
